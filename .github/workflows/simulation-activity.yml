name: Simulate User Activity (Platform - Auth Service)

on:
  schedule:
    - cron: "40 12,20 * * 1-5"   # Weekdays at 12:40 & 20:40 UTC (2x/day)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    env:
      S_PAT_TAYLOR:   ${{ secrets.PAT_TAYLOR }}
      S_PAT_JEFF:     ${{ secrets.PAT_JEFF }}
      S_PAT_STEPH:    ${{ secrets.PAT_STEPH }}
      S_PAT_CHASE:    ${{ secrets.PAT_CHASE }}

      # Team actors (Platform)
      ACTORS: |
        [
          {"username":"jeff","git_name":"Jeff Schnitter","git_email":"jeff@cortex.io","pat_secret":"PAT_JEFF"},
          {"username":"steph","git_name":"Steph","git_email":"steph@cortex.io","pat_secret":"PAT_STEPH"},
          {"username":"taylor","git_name":"Taylor Schmidt","git_email":"taylor@cortex.io","pat_secret":"PAT_TAYLOR"}
        ]
      REVIEWER_CANDIDATES: |
        ["PAT_TAYLOR","PAT_JEFF","PAT_STEPH","PAT_CHASE"]
      # Platform: moderate speed, middle merge rate
      FIRST_REVIEW_MIN: "12"
      FIRST_REVIEW_MAX: "90"
      APPROVAL_MIN: "10"
      APPROVAL_MAX: "120"

      # --- Time-to-open delay (first commit -> PR created), in minutes ---
      OPEN_DELAY_MIN: "5"     # lower bound
      OPEN_DELAY_MAX: "180"   # upper bound

    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -y && sudo apt-get install -y jq

      - name: Pick one random actor (only from tokens available)
        id: pick
        shell: bash
        run: |
          eligible=(); len=$(jq 'length' <<< "${ACTORS}")
          for i in $(seq 0 $((len-1))); do
            obj=$(jq -r ".[$i]" <<< "${ACTORS}")
            sec=$(jq -r '.pat_secret' <<< "$obj")
            tok_var="S_${sec}"
            tok="${!tok_var}"
            [ -n "$tok" ] && eligible+=("$i")
          done
          if [ "${#eligible[@]}" -eq 0 ]; then
            echo "pat_secret=" >> $GITHUB_OUTPUT
            exit 0
          fi
          pick_idx="${eligible[$((RANDOM % ${#eligible[@]}))]}"
          obj=$(jq -r ".[$pick_idx]" <<< "${ACTORS}")
          echo "username=$(jq -r '.username' <<< "$obj")"   >> $GITHUB_OUTPUT
          echo "git_name=$(jq -r '.git_name' <<< "$obj")"   >> $GITHUB_OUTPUT
          echo "git_email=$(jq -r '.git_email' <<< "$obj")" >> $GITHUB_OUTPUT
          echo "pat_secret=$(jq -r '.pat_secret' <<< "$obj")" >> $GITHUB_OUTPUT

      - name: Resolve actor token (skip if missing)
        id: auth
        shell: bash
        run: |
          if [ -z "${{ steps.pick.outputs.pat_secret }}" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          PAT_SECRET="${{ steps.pick.outputs.pat_secret }}"; TOKEN_VAR="S_${PAT_SECRET}"; TOKEN="${!TOKEN_VAR}"
          if [ -z "$TOKEN" ]; then
            echo "skip=true" >> $GITHUB_OUTPUT; exit 0; fi
          echo "$TOKEN" | gh auth login --with-token
          echo "GH_TOKEN=$TOKEN" >> $GITHUB_ENV
          echo "AUTHOR=${{ steps.pick.outputs.git_name }}" >> $GITHUB_ENV
          echo "EMAIL=${{ steps.pick.outputs.git_email }}" >> $GITHUB_ENV
          echo "BRANCH=sim/${{ steps.pick.outputs.username }}-$(date +%s)" >> $GITHUB_ENV

      - name: Stop if no actor token
        if: steps.auth.outputs.skip == 'true'
        run: echo "No valid actor token; ending run."

      - name: Pick scenario
        id: scenario
        if: steps.auth.outputs.skip != 'true'
        shell: bash
        run: |
          scenarios=("OPEN_ONLY" "COMMENT_REVIEW" "APPROVE" "MERGE" "CLOSE_UNMERGED" "BIG_DIFF" "SMALL_DIFF")
          weights=(4 3 2 2 1 1 2)
          total=0; for w in "${weights[@]}"; do total=$((total+w)); done
          r=$((RANDOM % total)); acc=0
          for i in "${!scenarios[@]}"; do
            acc=$((acc+weights[i]))
            if [ $r -lt $acc ]; then echo "value=${scenarios[i]}" >> $GITHUB_OUTPUT; break; fi
          done

      - name: Commit change (README preferred; varied size, files, and commits)
        if: steps.auth.outputs.skip != 'true'
        shell: bash
        run: |
          set -e
          git config user.name "${AUTHOR}"
          git config user.email "${EMAIL}"
          BRANCH="${BRANCH}"
          git checkout -b "$BRANCH"
          scenario="${{ steps.scenario.outputs.value }}"
          case "$scenario" in
            BIG_DIFF)   MIN=8;  MAX=20 ;;
            SMALL_DIFF) MIN=1;  MAX=3  ;;
            *)          MIN=1;  MAX=8  ;;
          esac
          COMMITS=$((1 + RANDOM % 3))
          if [ "$scenario" = "BIG_DIFF" ]; then
            ADD_SECOND_FILE=true
          else
            [ $((RANDOM % 10)) -lt 3 ] && ADD_SECOND_FILE=true || ADD_SECOND_FILE=false
          fi
          if [ $((RANDOM % 10)) -lt 7 ]; then
            PRIMARY_FILE="README.md"
          else
            mkdir -p sim/notes
            PRIMARY_FILE="sim/notes/$(date -u +%Y-%m-%d).md"
          fi
          SECONDARY_FILE=""
          if $ADD_SECOND_FILE; then
            mkdir -p sim/misc
            SECONDARY_FILE="sim/misc/changes-$(date -u +%Y%m%d).md"
          fi
          for c in $(seq 1 "$COMMITS"); do
            TOUCH_SECOND=false
            if $ADD_SECOND_FILE; then
              [ $((RANDOM % 10)) -lt 5 ] && TOUCH_SECOND=true
            fi
            LINES=$(( MIN + RANDOM % (MAX - MIN + 1) ))
            {
              echo ""
              echo "### Update by ${AUTHOR} (commit ${c}/${COMMITS}) at $(date -u)"
              for i in $(seq 1 "$LINES"); do
                echo "- simulated activity ${i} (commit ${c}) on $(date -u) id=$RANDOM"
              done
            } >> "$PRIMARY_FILE"
            git add "$PRIMARY_FILE"
            if $TOUCH_SECOND && [ -n "$SECONDARY_FILE" ]; then
              EXTRA_LINES=$((1 + RANDOM % 6))
              {
                echo ""
                echo "### Extra changes by ${AUTHOR} (commit ${c}/${COMMITS}) at $(date -u)"
                for i in $(seq 1 "$EXTRA_LINES"); do
                  echo "* note ${i} (commit ${c}) $(date -u) token=$RANDOM"
                done
              } >> "$SECONDARY_FILE"
              git add "$SECONDARY_FILE"
            fi
            git commit -m "sim: ${LINES} lines in ${PRIMARY_FILE}${TOUCH_SECOND:+ + extra} (${scenario}) [${c}/${COMMITS}] at $(date -u)"
          done
          echo "COMMITS=$COMMITS" >> "$GITHUB_ENV"
          git push -u origin HEAD
          set +e

      - name: Decide pre-open delay (commit -> PR created)
        id: preopen
        if: steps.auth.outputs.skip != 'true'
        shell: bash
        run: |
          rr() { local lo="$1" hi="$2"; echo $(( lo + RANDOM % (hi - lo + 1) )); }
          O_MIN=${OPEN_DELAY_MIN:-5}
          O_MAX=${OPEN_DELAY_MAX:-180}
          if [ "${{ steps.scenario.outputs.value }}" = "BIG_DIFF" ]; then
            O_MIN=$(( O_MIN + 30 ))
            O_MAX=$(( O_MAX + 240 ))
            FACTOR_PCT=160
          else
            FACTOR_PCT=80
          fi
          base=$(rr "$O_MIN" "$O_MAX")
          delay_m=$(( (base * FACTOR_PCT + 99) / 100 ))
          [ $delay_m -gt 300 ] && delay_m=300
          echo "minutes=$delay_m" >> $GITHUB_OUTPUT
          echo "Pre-open delay: ${delay_m}m (scenario=${{ steps.scenario.outputs.value }})"

      - name: Open a PR (after pre-open delay)
        id: openpr
        if: steps.auth.outputs.skip != 'true'
        shell: bash
        run: |
          mins=${{ steps.preopen.outputs.minutes }}
          echo "Simulating time-to-open... sleeping ${mins} minutes"
          sleep $(( mins * 60 ))
          URL=$(gh pr create \
            --title "Sim PR by ${AUTHOR}" \
            --body "Automated demo PR at $(date -u). Scenario: ${{ steps.scenario.outputs.value }}. Commits: ${COMMITS:-1}" \
            --base main --head "${BRANCH}" --draft=false 2>&1) || echo "PR create failed: $URL"
          echo "url=$URL" >> $GITHUB_OUTPUT
          echo "PR URL: $URL"

      - name: Find an open PR to act on
        id: pr
        if: steps.auth.outputs.skip != 'true'
        shell: bash
        run: |
          NUM=""

          # Try the PR we just opened
          if [ -n "${{ steps.openpr.outputs.url }}" ]; then
            NUM=$(gh pr view "${{ steps.openpr.outputs.url }}" --json number -q .number 2>/dev/null || true)
          fi

          # Fallback: find any open PR by this actor's GitHub username (newest first)
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            NUM=$(gh pr list --state open --author "${{ steps.pick.outputs.username }}" \
              --json number,createdAt \
              -q 'sort_by(.createdAt) | last | .number' 2>/dev/null || true)
          fi

          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            echo "No open PR found for ${{ steps.pick.outputs.username }} — nothing to review or merge."
            echo "number=" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "number=$NUM" >> $GITHUB_OUTPUT
          echo "Acting on PR #$NUM"

      - name: Decide review/approval delays
        id: delays
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          rr(){ local lo="$1" hi="$2"; echo $(( lo + RANDOM % (hi - lo + 1) )); }
          echo "first_review_minutes=$(rr "${FIRST_REVIEW_MIN:-12}" "${FIRST_REVIEW_MAX:-90}")" >> $GITHUB_OUTPUT
          echo "approval_minutes=$(rr "${APPROVAL_MIN:-10}" "${APPROVAL_MAX:-120}")" >> $GITHUB_OUTPUT

      - name: Pick reviewer secret name
        id: pick_reviewer
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          pool=$(jq -r 'map(select(. != "'${{ steps.pick.outputs.pat_secret }}'"))' <<< "${REVIEWER_CANDIDATES}")
          chosen=""
          for i in {1..10}; do
            len=$(jq 'length' <<< "$pool"); [ "$len" -eq 0 ] && break
            idx=$((RANDOM % len))
            sec=$(jq -r ".[$idx]" <<< "$pool")
            tok_var="S_${sec}"
            tok="${!tok_var}"
            if [ -n "$tok" ]; then chosen="$sec"; break; fi
          done
          echo "secret=$chosen" >> $GITHUB_OUTPUT

      - name: Wait, then leave first review (COMMENT)
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != '' && steps.pick_reviewer.outputs.secret != ''
        shell: bash
        run: |
          mins=${{ steps.delays.outputs.first_review_minutes }}
          echo "Sleeping ${mins} minutes before first review..."
          sleep $(( mins * 60 ))
          tok_var="S_${{ steps.pick_reviewer.outputs.secret }}"
          REVIEWER_TOKEN="${!tok_var}"
          [ -n "$REVIEWER_TOKEN" ] || exit 0
          ORIGINAL_GH_TOKEN="$GH_TOKEN"; unset GH_TOKEN
          echo "$REVIEWER_TOKEN" | gh auth login --with-token
          gh pr review ${{ steps.pr.outputs.number }} --comment --body "First review pass at $(date -u)"
          gh auth logout -h github.com -y || true
          echo "$ORIGINAL_GH_TOKEN" | gh auth login --with-token
          echo "GH_TOKEN=$ORIGINAL_GH_TOKEN" >> $GITHUB_ENV

      - name: Pick approver secret name (can be same or different)
        id: pick_approver
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          pool=$(jq -r 'map(select(. != "'${{ steps.pick.outputs.pat_secret }}'"))' <<< "${REVIEWER_CANDIDATES}")
          chosen=""
          for i in {1..10}; do
            len=$(jq 'length' <<< "$pool"); [ "$len" -eq 0 ] && break
            idx=$((RANDOM % len))
            sec=$(jq -r ".[$idx]" <<< "$pool")
            tok_var="S_${sec}"
            tok="${!tok_var}"
            if [ -n "$tok" ]; then chosen="$sec"; break; fi
          done
          if [ -z "$chosen" ] && [ -n "${{ steps.pick_reviewer.outputs.secret }}" ]; then
            tok_var="S_${{ steps.pick_reviewer.outputs.secret }}"
            tok="${!tok_var}"
            [ -n "$tok" ] && chosen="${{ steps.pick_reviewer.outputs.secret }}"
          fi
          echo "secret=$chosen" >> $GITHUB_OUTPUT

      - name: Wait, then maybe approve
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != '' && steps.pick_approver.outputs.secret != ''
        shell: bash
        run: |
          if [ $((RANDOM % 10)) -ge 7 ]; then
            echo "Skipping approval this time."; exit 0
          fi
          mins=${{ steps.delays.outputs.approval_minutes }}
          echo "Sleeping ${mins} minutes before approval..."
          sleep $(( mins * 60 ))
          tok_var="S_${{ steps.pick_approver.outputs.secret }}"
          APPROVER_TOKEN="${!tok_var}"
          [ -n "$APPROVER_TOKEN" ] || exit 0
          ORIGINAL_GH_TOKEN="$GH_TOKEN"; unset GH_TOKEN
          echo "$APPROVER_TOKEN" | gh auth login --with-token
          gh pr review ${{ steps.pr.outputs.number }} --approve --body "Approval at $(date -u)"
          gh auth logout -h github.com -y || true
          echo "$ORIGINAL_GH_TOKEN" | gh auth login --with-token
          echo "GH_TOKEN=$ORIGINAL_GH_TOKEN" >> $GITHUB_ENV

      - name: Diagnose mergeability
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          gh pr view ${{ steps.pr.outputs.number }} \
            --json state,mergeable,mergeStateStatus,reviewDecision,baseRefName,isDraft \
            -q '
              "state=" + .state + "\n" +
              "mergeable=" + (.mergeable|tostring) + "\n" +
              "mergeStateStatus=" + .mergeStateStatus + "\n" +
              "reviewDecision=" + (.reviewDecision|tostring) + "\n" +
              "baseRefName=" + .baseRefName + "\n" +
              "isDraft=" + (.isDraft|tostring)
            '

      - name: Maybe (auto) merge PR
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          # Platform mid merge rate ~50 percent
          if [ $((RANDOM % 10)) -lt 5 ]; then
            set +e
            gh pr merge ${{ steps.pr.outputs.number }} --merge --auto --delete-branch
            set -e
          else
            echo "Skipping merge attempt this run."
          fi

      - name: Maybe close without merge
        if: steps.auth.outputs.skip != 'true' && steps.pr.outputs.number != ''
        shell: bash
        run: |
          if [ $((RANDOM % 20)) -lt 3 ]; then
            gh pr close ${{ steps.pr.outputs.number }} --delete-branch
          fi

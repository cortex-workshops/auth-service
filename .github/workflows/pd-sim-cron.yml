name: PagerDuty Simulation (Scheduled)

on:
  # Cron is UTC. Adjust if needed for CST/CDT transitions.
  schedule:
    - cron: "0 15 * * 1-5"   # Weekdays at ~10 AM CT
    - cron: "0 20 * * 1-5"   # Weekdays at ~3 PM CT
  workflow_dispatch: {}       # Allow manual runs too

jobs:
  simulate:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    strategy:
      fail-fast: false
      matrix:
        include:
          - service: billing
            env_tag: sim
            min_minutes: 8
            max_minutes: 22
            probability: 0.90
            severity: error
            secret: PD_ROUTING_KEY_BILLING
          - service: messaging
            env_tag: sim
            min_minutes: 12
            max_minutes: 35
            probability: 0.75
            severity: warning
            secret: PD_ROUTING_KEY_MESSAGING
          - service: auth
            env_tag: sim
            min_minutes: 45
            max_minutes: 90
            probability: 0.60
            severity: critical
            secret: PD_ROUTING_KEY_AUTH
          - service: checkout
            env_tag: sim
            min_minutes: 5
            max_minutes: 60
            probability: 0.70
            severity: error
            secret: PD_ROUTING_KEY_CHECKOUT

    steps:
      - name: Decide whether to simulate today
        id: gate
        run: |
          PROB="${{ matrix.probability }}"
          R=$(python -c "import random; print(random.random())")
          echo "random=$R"
          if python -c "import sys; sys.exit(0 if float('$R') <= float('$PROB') else 1)"; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Skip service for today
        if: steps.gate.outputs.pass == 'false'
        run: |
          echo "Skipping ${{ matrix.service }} today based on probability ${{ matrix.probability }}."
          exit 0

      - name: Pick randomized MTTR (sleep) in minutes
        id: mttr
        env:
          MIN: ${{ matrix.min_minutes }}
          MAX: ${{ matrix.max_minutes }}
        run: |
          DURATION_MIN=$(python -c "import random, os; mn, mx = int(os.environ['MIN']), int(os.environ['MAX']); print(random.randint(mn, mx))")
          echo "minutes=$DURATION_MIN" >> "$GITHUB_OUTPUT"

      - name: Open incident (trigger)
        id: open
        env:
          ROUTING_KEY: ${{ secrets[matrix.secret] }}
          SERVICE: ${{ matrix.service }}
          ENV_TAG: ${{ matrix.env_tag }}
          SEVERITY: ${{ matrix.severity }}
          MINUTES: ${{ steps.mttr.outputs.minutes }}
        run: |
          set -euo pipefail
          URL="https://events.pagerduty.com/v2/enqueue"
          DEDUP="sim:${ENV_TAG}:${SERVICE}:run-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "DEDUP_KEY=$DEDUP" >> "$GITHUB_ENV"

          jq -n \
            --arg rk "$ROUTING_KEY" \
            --arg dedup "$DEDUP" \
            --arg summary "Simulation incident for ${SERVICE} (target MTTR ${MINUTES} min)" \
            --arg source "gh-actions" \
            --arg severity "$SEVERITY" \
            --arg env "$ENV_TAG" \
            --arg service "$SERVICE" \
            --argjson mttr "$MINUTES" \
            --arg run_id "$GITHUB_RUN_ID" \
            --arg attempt "$GITHUB_RUN_ATTEMPT" \
            '{
              routing_key: $rk,
              event_action: "trigger",
              dedup_key: $dedup,
              payload: {
                summary: $summary,
                source: $source,
                severity: $severity,
                custom_details: {
                  env: $env,
                  service: $service,
                  sim: true,
                  target_mttr_minutes: $mttr,
                  run_id: $run_id,
                  attempt: $attempt
                }
              }
            }' > body.json

          echo "Triggering incident for ${SERVICE}..."
          curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data @body.json | jq .

      - name: Hold for MTTR window (sleep)
        env:
          MINUTES: ${{ steps.mttr.outputs.minutes }}
        run: |
          echo "Sleeping ${MINUTES} minutes to simulate time to resolve..."
          SECONDS=$(( MINUTES * 60 ))
          sleep "$SECONDS"

      - name: Close incident (resolve)
        env:
          ROUTING_KEY: ${{ secrets[matrix.secret] }}
          DEDUP_KEY: ${{ env.DEDUP_KEY }}
        run: |
          set -euo pipefail
          URL="https://events.pagerduty.com/v2/enqueue"

          jq -n \
            --arg rk "$ROUTING_KEY" \
            --arg dedup "$DEDUP_KEY" \
            '{
              routing_key: $rk,
              event_action: "resolve",
              dedup_key: $dedup
            }' > body.json

          echo "Resolving incident with dedup_key=${DEDUP_KEY}..."
          curl -sS -X POST "$URL" \
            -H "Content-Type: application/json" \
            --data @body.json | jq .
